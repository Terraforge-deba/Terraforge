<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Terraforge</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Terraforge — a voxel geoscience adventure: explore, discover and mine, from desk study to mine closure.">
<meta name="theme-color" content="#0f1620">
<meta property="og:title" content="Terraforge — Explore · Discover · Mine">
<meta property="og:description" content="A voxel geoscience field adventure: build, survive the night, and take a mineral from desk study to mine closure.">
<meta property="og:image" content="og-image.jpg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  html, body { margin: 0; height: 100%; background: #0a1016; color: #e9eef2; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center; padding: 20px; box-sizing: border-box; }
  .logo { font-size: clamp(34px, 9vw, 64px); font-weight: 900; letter-spacing: clamp(3px, 1.2vw, 10px); background: linear-gradient(90deg, #f5a623, #ffd36b 45%, #2ec4b6); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .bar { width: min(280px, 70vw); height: 6px; border-radius: 3px; background: rgba(255,255,255,.1); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 35%; border-radius: 3px; background: linear-gradient(90deg, #f5a623, #2ec4b6); animation: slide 1.2s ease-in-out infinite; }
  @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(290%); } }
  #msg { font-size: 14px; color: #9fb0bf; max-width: 460px; line-height: 1.5; }
  #msg b { color: #ffb4a8; }
  button { font: inherit; font-weight: 600; padding: 10px 22px; border-radius: 12px; border: 0; background: linear-gradient(90deg, #2ec4b6, #27a99d); color: #04201d; cursor: pointer; display: none; }
</style>
<script src="config.js"></script>
</head>
<body>
<div class="wrap">
  <img src="icons/icon-192.png" width="96" height="96" alt="">
  <div class="logo">TERRAFORGE</div>
  <div class="bar" id="bar"><i></i></div>
  <div id="msg">Loading the latest version…</div>
  <button id="retry" onclick="location.reload()">Try again</button>
</div>
<script>
/* Terraforge loader.
   The game itself lives in Google Apps Script. Every time this page opens it downloads the
   newest version from there, so this GitHub page never needs to be updated.
   The last version is kept on the device, so the game still opens on a weak connection. */
(function () {
  var API = String(window.TERRAFORGE_API || '').trim();
  var KEY = 'tf_game_html';
  var msg = document.getElementById('msg');
  function cached() { try { return localStorage.getItem(KEY) || ''; } catch (e) { return ''; } }
  function remember(h) { try { localStorage.setItem(KEY, h); } catch (e) {} }
  function run(html) {
    document.open();
    document.write(html);
    document.close();
  }
  function fail(text) {
    var old = cached();
    if (old) { run(old); return; }           // offline or slow: open the last version
    document.getElementById('bar').style.display = 'none';
    msg.innerHTML = '<b>' + text + '</b>';
    document.getElementById('retry').style.display = 'inline-block';
  }
  if (!API) { fail('This game is not connected yet: put your Apps Script web-app link in config.js.'); return; }
  var done = false, timer = setTimeout(function () { if (!done) { done = true; fail('The game server is taking too long to answer. Check your internet connection.'); } }, 20000);
  fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: 'gameHtml', args: [] }) })
    .then(function (r) { return r.json(); })
    .then(function (j) {
      if (done) return; done = true; clearTimeout(timer);
      if (!j.ok || typeof j.result !== 'string' || j.result.indexOf('<html') < 0) throw new Error(j.error || 'bad reply');
      remember(j.result);
      run(j.result);
    })
    .catch(function (e) { if (done) return; done = true; clearTimeout(timer); fail('Could not reach the game server (' + (e && e.message || e) + ').'); });
})();
</script>
</body>
</html>
